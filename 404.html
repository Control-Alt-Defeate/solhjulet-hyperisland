<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found | SOLHJULET</title>
    
    <script>
        const siteBase = location.hostname.endsWith('github.io')
            ? `/${location.pathname.split('/')[1]}/`
            : '/';
        const base = document.createElement('base');
        base.href = siteBase;
        document.head.append(base);
    </script>

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="pages/404.css">
</head>
<body>

    <div data-site-nav></div>

    <main class="error-page-main">
        <div class="error-content">
            <span class="error-badge">404</span>
            <h1>Yikes, this page was not found</h1>
            <p>Looks like you've taken a wrong turn.</p>
            <a href="index.html" class="home-btn">Back to Home</a>
        </div>

        <div class="error-illustration">
            <img
                src="assets/broken-house-404.png"
                alt=""
                width="800"
                height="533"
            >
        </div>
    </main>

    <div data-site-footer></div>

    <script src="js/layout.js"></script>
</body>
</html>
